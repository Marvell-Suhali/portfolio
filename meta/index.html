<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meta</title>

  <link rel="stylesheet" href="../style.css" />

  <script type="module" src="../global.js"></script>
  <script type="module" src="./main.js"></script>
</head>

<body>
  <h1>Meta</h1>
  <p>This page analyzes the codebase of my portfolio website.</p>

  <h2>Summary Stats</h2>
  <div id="stats"></div>

  <h2>Commits by Time of Day</h2>

  <div class="slider-container">
    <label for="commit-progress">
      Show commits until:
      <input id="commit-progress" type="range" min="0" max="100" value="100" />
      <time id="commit-time"></time>
    </label>
  </div>

<div id="scrolly-1">
  <div id="scatter-story"></div>  

  <div id="scatter-plot">         
    <div id="chart"></div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd><a href="" id="commit-link" target="_blank"></a></dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="commit-time-tooltip"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines Edited</dt>
      <dd id="commit-lines"></dd>
    </dl>
  </div>
</div>

  <p id="selection-count">No commits selected</p>

  <h2>Files by Number of Lines</h2>
  <dl id="files"></dl>

  <h2>Language Breakdown</h2>
  <dl id="language-breakdown" class="stats"></dl>
</body>
</html>
